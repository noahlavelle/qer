apiVersion: apps/v1
kind: Deployment
metadata:
  name: engine
spec:
  replicas: 1
  selector:
    matchLabels:
      app: engine
  template:
    metadata:
      labels:
        app: engine
    spec:
      containers:
        - name: engine
          image: qer-engine:dev
          ports:
            - name: grpc
              containerPort: 50051
          livenessProbe:
            grpc:
              port: 50051
              service: qer.v1.QueueEngine
            initialDelaySeconds: 2
            periodSeconds: 10
          readinessProbe:
            grpc:
              port: 50051
              service: qer.v1.QueueEngine
            initialDelaySeconds: 2
            periodSeconds: 5

---
apiVersion: v1
kind: Service
metadata:
  name: engine
spec:
  selector:
    app: engine
  ports:
    - name: grpc
      port: 50051
      targetPort: grpc
      protocol: TCP
